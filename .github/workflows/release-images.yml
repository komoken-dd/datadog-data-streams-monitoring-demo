name: Release container images

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  SOURCE_DATE_EPOCH: "1767225600"
  IMAGE_CREATED: "2026-01-01T00:00:00Z"

jobs:
  validate:
    name: Validate released source
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-java:
    name: Build and test Java applications
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image-prefix: ${{ steps.release.outputs.image-prefix }}
      release-tag: ${{ steps.release.outputs.release-tag }}
      source-sha: ${{ steps.release.outputs.source-sha }}
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -Eeuo pipefail
          release_tag="${RELEASE_TAG}"
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version beginning with v: ${release_tag}" >&2
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_prefix="ghcr.io/${repository}"
          {
            echo "image-prefix=${image_prefix}"
            echo "release-tag=${release_tag}"
            echo "source-sha=${source_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and verify all Maven modules once
        shell: bash
        run: |
          set -Eeuo pipefail
          source config/container-images.sh
          if [[ ! "${MAVEN_IMAGE_AMD64}" =~ ^docker\.io/library/maven@sha256:[0-9a-f]{64}$ ]]; then
            echo "MAVEN_IMAGE_AMD64 must be pinned by digest." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install --yes podman
          podman build --platform linux/amd64 --target java-build \
            --build-arg BUILDARCH=amd64 \
            --build-arg "MAVEN_IMAGE=${MAVEN_IMAGE_MULTIARCH}" \
            --build-arg "JAVA_JDK_AMD64_SHA256=${JAVA_JDK_AMD64_SHA256}" \
            --build-arg "JAVA_JDK_ARM64_SHA256=${JAVA_JDK_ARM64_SHA256}" \
            --tag localhost/brokerage-java-build --file apps/Containerfile \
            --ignorefile apps/.containerignore apps
          podman run --rm \
            --platform linux/amd64 \
            --volume "${GITHUB_WORKSPACE}/apps:/workspace" \
            --workdir /workspace \
            localhost/brokerage-java-build \
            mvn -B clean verify

      - name: Package application jars
        shell: bash
        run: |
          set -Eeuo pipefail
          services=(
            order-flow-simulator
            order-service
            buying-power-service
            exchange-gateway-simulator
            holdings-service
            trade-report-service
            notification-service
            push-gateway-simulator
            order-state-service
            exception-management-service
          )
          jars=()
          for service in "${services[@]}"; do
            candidates=("apps/${service}/target/${service}-"*.jar)
            if [[ ${#candidates[@]} -ne 1 || ! -f "${candidates[0]}" ]]; then
              echo "Expected exactly one packaged jar for ${service}." >&2
              exit 1
            fi
            jars+=("${candidates[0]}")
          done
          tar --create --file application-jars.tar "${jars[@]}"

      - name: Upload application jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-jars
          path: application-jars.tar
          if-no-files-found: error
          retention-days: 1

  build-images:
    name: Build ${{ matrix.service }} image
    needs: build-java
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        service:
          - order-flow-simulator
          - order-service
          - buying-power-service
          - exchange-gateway-simulator
          - holdings-service
          - trade-report-service
          - notification-service
          - push-gateway-simulator
          - order-state-service
          - exception-management-service
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Download application jars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-jars
          path: .

      - name: Extract application jars
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --extract --file application-jars.tar
          candidates=("apps/${{ matrix.service }}/target/${{ matrix.service }}-"*.jar)
          if [[ ${#candidates[@]} -ne 1 || ! -f "${candidates[0]}" ]]; then
            echo "Expected exactly one packaged jar for ${{ matrix.service }}." >&2
            exit 1
          fi

      - name: Resolve pinned build inputs and image references
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          source config/container-images.sh
          runtime_image="${JAVA_RUNTIME_IMAGE_MULTIARCH:-}"
          if [[ ! "${runtime_image}" =~ ^registry\.access\.redhat\.com/ubi9/ubi-minimal@sha256:[0-9a-f]{64}$ ]]; then
            echo "JAVA_RUNTIME_IMAGE_MULTIARCH must pin the reviewed UBI runtime OS multi-architecture index digest." >&2
            exit 1
          fi

          image="${{ needs.build-java.outputs.image-prefix }}/${{ matrix.service }}"
          release_tag="${{ needs.build-java.outputs.release-tag }}"
          {
            echo "image=${image}"
            echo "release-ref=${image}:${release_tag}"
            echo "runtime-image=${runtime_image}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve an existing immutable release image
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.release-ref }}
          EXPECTED_SOURCE_SHA: ${{ needs.build-java.outputs.source-sha }}
          RELEASE_TAG: ${{ needs.build-java.outputs.release-tag }}
        run: |
          set -Eeuo pipefail
          set +e
          manifest_json="$(docker buildx imagetools inspect \
            "${IMAGE_REFERENCE}" \
            --format '{{json .Manifest}}' \
            2>inspect-error.log)"
          inspect_status=$?
          set -e

          if [[ ${inspect_status} -eq 0 ]]; then
            digest="$(jq -er '.digest' <<<"${manifest_json}")"
            revision="$(jq -er '.annotations["org.opencontainers.image.revision"]' <<<"${manifest_json}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Existing image has an invalid digest: ${IMAGE_REFERENCE}" >&2
              exit 1
            }
            if [[ "${revision}" != "${EXPECTED_SOURCE_SHA}" ]]; then
              echo "Refusing to move immutable release tag ${IMAGE_REFERENCE}." >&2
              echo "Expected source ${EXPECTED_SOURCE_SHA}, found ${revision}." >&2
              exit 1
            fi
            # A revision annotation is descriptive metadata, not proof of
            # origin. Reuse only an image already attested by this workflow
            # for the same immutable tag and source commit.
            if ! gh attestation verify "oci://${IMAGE_REFERENCE}@${digest}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-images.yml" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "${EXPECTED_SOURCE_SHA}" \
              --deny-self-hosted-runners >/dev/null; then
              echo "The existing release image lacks the required trusted attestation." >&2
              echo "Delete only this incomplete tag, then rerun the release workflow: ${IMAGE_REFERENCE}" >&2
              exit 1
            fi
            {
              echo "exists=true"
              echo "digest=${digest}"
            } >> "${GITHUB_OUTPUT}"
            echo "Reusing the existing image from the same released source: ${IMAGE_REFERENCE}@${digest}"
          elif grep -Eiq 'not found|manifest unknown|name unknown' inspect-error.log; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Unable to determine whether the release image already exists:" >&2
            sed 's/^/  /' inspect-error.log >&2
            exit "${inspect_status}"
          fi

      - name: Limit the Docker build context to the packaged jar
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: cp apps/.containerignore "apps/${{ matrix.service }}/.dockerignore"

      - name: Build and push multi-platform image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: "1"
        with:
          context: apps/${{ matrix.service }}
          file: apps/Containerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          tags: ${{ steps.image.outputs.release-ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.build-java.outputs.source-sha }}
            org.opencontainers.image.version=${{ needs.build-java.outputs.release-tag }}
            org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.service }} from the Datadog Data Streams Monitoring demo
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ needs.build-java.outputs.source-sha }}
            index:org.opencontainers.image.version=${{ needs.build-java.outputs.release-tag }}
            index:org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.description=${{ matrix.service }} from the Datadog Data Streams Monitoring demo
          build-args: |
            RUNTIME_IMAGE=${{ steps.image.outputs.runtime-image }}
            VCS_REF=${{ needs.build-java.outputs.source-sha }}
            IMAGE_VERSION=${{ needs.build-java.outputs.release-tag }}
            IMAGE_CREATED=${{ env.IMAGE_CREATED }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=image,push=true,name-canonical=true,rewrite-timestamp=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Resolve the published image digest
        id: published
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          set -Eeuo pipefail
          digest="${BUILT_DIGEST:-${EXISTING_DIGEST:-}}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "The published image digest is missing or invalid." >&2
            exit 1
          }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest image build provenance
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
          # Linked-artifact storage records are organization-only; this
          # user-owned public repository uses the GH attestation API and GHCR.
          create-storage-record: false

      - name: Record image digest
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p image-digest
          jq --null-input \
            --arg service "${{ matrix.service }}" \
            --arg image "${{ steps.image.outputs.image }}" \
            --arg digest "${{ steps.published.outputs.digest }}" \
            --arg reference "${{ steps.image.outputs.release-ref }}@${{ steps.published.outputs.digest }}" \
            '{service: $service, image: $image, digest: $digest, reference: $reference}' \
            > "image-digest/${{ matrix.service }}.json"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.service }}
          path: image-digest/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 1

  publish-release-manifest:
    name: Publish release image manifest
    needs: [build-java, build-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Assemble release image manifest
        id: manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          services=(
            order-flow-simulator
            order-service
            buying-power-service
            exchange-gateway-simulator
            holdings-service
            trade-report-service
            notification-service
            push-gateway-simulator
            order-state-service
            exception-management-service
          )
          release_tag="${{ needs.build-java.outputs.release-tag }}"
          references='{}'
          for service in "${services[@]}"; do
            digest_file="image-digests/${service}.json"
            if [[ ! -f "${digest_file}" ]]; then
              echo "Missing digest artifact for ${service}." >&2
              exit 1
            fi
            if [[ "$(jq --raw-output '.service' "${digest_file}")" != "${service}" ]]; then
              echo "Digest artifact service mismatch: ${digest_file}" >&2
              exit 1
            fi
            reference="$(jq --exit-status --raw-output '.reference' "${digest_file}")"
            expected_prefix="${{ needs.build-java.outputs.image-prefix }}/${service}:${release_tag}@sha256:"
            digest="${reference#"${expected_prefix}"}"
            if [[ "${reference}" != "${expected_prefix}"* || ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Unexpected image reference for ${service}: ${reference}" >&2
              exit 1
            fi
            references="$(jq --compact-output \
              --arg service "${service}" \
              --arg reference "${reference}" \
              '. + {($service): $reference}' <<<"${references}")"
          done

          asset="brokerage-demo-images-${release_tag}.json"
          jq --null-input --sort-keys \
            --arg tag "${release_tag}" \
            --arg source_revision "${{ needs.build-java.outputs.source-sha }}" \
            --argjson references "${references}" \
            '{
              release: {
                schemaVersion: 1,
                tag: $tag,
                sourceRevision: $source_revision
              },
              version: $tag,
              image: {references: $references}
            }' > "${asset}"
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Attest release image manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.manifest.outputs.asset }}

      - name: Upload manifest to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_tag="${{ needs.build-java.outputs.release-tag }}"
          asset="${{ steps.manifest.outputs.asset }}"
          if gh release view "${release_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' | grep -Fxq "${asset}"; then
            download_dir="$(mktemp -d)"
            trap 'rm -rf -- "${download_dir}"' EXIT
            gh release download "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${asset}" \
              --dir "${download_dir}"
            if ! cmp -s "${asset}" "${download_dir}/${asset}"; then
              echo "Refusing to replace an existing release image manifest with different content." >&2
              exit 1
            fi
            echo "The identical release image manifest is already attached; keeping it unchanged."
          else
            gh release upload "${release_tag}" "${asset}" --repo "${GITHUB_REPOSITORY}"
          fi
