spring:
  application.name: order-service
  task.scheduling.pool.size: 3
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgresql:5432/brokerage}
    username: ${DATABASE_USERNAME:order_service_runtime}
    password: ${DATABASE_PASSWORD:}
  flyway:
    table: flyway_schema_history_order_service
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:brokerage-kafka-kafka-bootstrap:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.github.komokendd.dsm.brokerage.common.AvroSpecificSerializer
      acks: all
      properties.enable.idempotence: true
    template.observation-enabled: true
management:
  endpoints.web.exposure.include: health,info,metrics
  statsd.metrics.export:
    enabled: ${DD_METRICS_ENABLED:false}
    flavor: datadog
    host: ${DD_AGENT_HOST:localhost}
    port: ${DD_DOGSTATSD_PORT:8125}
    polling-frequency: 10s
logging.structured.format.console: logstash
demo.buying-power:
  url: ${BUYING_POWER_SERVICE_URL:http://buying-power-service:8080}
  connect-timeout: ${BUYING_POWER_CONNECT_TIMEOUT:500ms}
  read-timeout: ${BUYING_POWER_READ_TIMEOUT:2s}
