spring:
  application:
    name: pre-trade-control-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:fx-kafka-kafka-bootstrap:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.github.komokendd.dsm.fx.common.AvroSpecificSerializer
      acks: all
      properties:
        enable.idempotence: true
    template:
      observation-enabled: true
management:
  endpoints.web.exposure.include: health,info,metrics
  statsd.metrics.export:
    enabled: ${DD_METRICS_ENABLED:false}
    flavor: datadog
    host: ${DD_AGENT_HOST:localhost}
    port: ${DD_DOGSTATSD_PORT:8125}
    polling-frequency: 10s
logging.structured.format.console: logstash
demo.controls.maximum-notional-usd: ${MAXIMUM_NOTIONAL_USD:5000000.00}
