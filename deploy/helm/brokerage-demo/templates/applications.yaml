{{- range .Values.applications }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "brokerage-demo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
    tags.datadoghq.com/env: {{ $.Values.environment | quote }}
    tags.datadoghq.com/service: {{ .name | quote }}
    tags.datadoghq.com/version: {{ $.Values.version | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: brokerage-demo
        tags.datadoghq.com/env: {{ $.Values.environment | quote }}
        tags.datadoghq.com/service: {{ .name | quote }}
        tags.datadoghq.com/version: {{ $.Values.version | quote }}
        admission.datadoghq.com/enabled: "true"
      annotations:
        admission.datadoghq.com/java-lib.custom-image: {{ $.Values.datadog.javaTracerImage | quote }}
        admission.datadoghq.com/apm-inject.custom-image: {{ $.Values.datadog.apmInjectorImage | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .database }}
      initContainers:
        - name: database-migrations
          image: {{ include "brokerage-demo.applicationImage" (dict "root" $ "application" .) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: BROKERAGE_DEMO_MIGRATE_ONLY
              value: "true"
            - name: DATABASE_URL
              value: "jdbc:postgresql://postgresql:5432/{{ $.Values.postgresql.database }}"
            - name: DATABASE_USERNAME
              value: {{ printf "brokerage_%s_migrator" (include "brokerage-demo.databaseSchema" .) | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "brokerage-demo-db-%s" .name }}
                  key: migration-password
            - name: DATABASE_SCHEMA
              value: {{ include "brokerage-demo.databaseSchema" . | quote }}
            - name: DATABASE_RUNTIME_ROLE
              value: {{ printf "brokerage_%s" (include "brokerage-demo.databaseSchema" .) | quote }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      {{- end }}
      containers:
        - name: {{ .name }}
          {{- $imageReference := get $.Values.image.references .name }}
          {{- if $imageReference }}
          image: {{ $imageReference | quote }}
          {{- else }}
          image: "{{ $.Values.image.repositoryPrefix }}/{{ .name }}:{{ $.Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ $.Values.kafka.name }}-kafka-bootstrap:9092"
            {{- $listenerServices := list "buying-power-service" "exchange-gateway-simulator" "holdings-service" "trade-report-service" "notification-service" "order-state-service" "exception-management-service" }}
            {{- if has .name $listenerServices }}
            - name: DEMO_HEALTH_KAFKA_LISTENERS
              value: "true"
            - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
              value: "readinessState,brokerageKafka"
            {{- end }}
            - name: DD_ENV
              value: {{ $.Values.environment | quote }}
            - name: DD_SERVICE
              value: {{ .name | quote }}
            - name: DD_VERSION
              value: {{ $.Values.version | quote }}
            - name: DD_DATA_STREAMS_ENABLED
              {{- if eq .name "order-state-service" }}
              value: {{ $.Values.datadog.dsm.orderStateServiceEnabled | quote }}
              {{- else }}
              value: "true"
              {{- end }}
            - name: DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
              value: "true"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_TRACE_OTEL_ENABLED
              value: "true"
            - name: DD_METRICS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_TAGS_ENV
              value: {{ $.Values.environment | quote }}
            - name: MANAGEMENT_METRICS_TAGS_SERVICE
              value: {{ .name | quote }}
            - name: MANAGEMENT_METRICS_TAGS_VERSION
              value: {{ $.Values.version | quote }}
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- if eq .name "order-flow-simulator" }}
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8080"
            - name: EXCHANGE_GATEWAY_URL
              value: "http://exchange-gateway-simulator:8080"
            - name: BUYING_POWER_SERVICE_URL
              value: "http://buying-power-service:8080"
            - name: ORDER_STATE_SERVICE_URL
              value: "http://order-state-service:8080"
            - name: BASELINE_PER_SECOND
              value: {{ $.Values.simulator.baselinePerSecond | quote }}
            - name: OPENING_RUSH_PER_SECOND
              value: {{ $.Values.simulator.openingRushPerSecond | quote }}
            - name: OPENING_RUSH_SECONDS
              value: {{ $.Values.simulator.openingRushSeconds | quote }}
            - name: SELL_OFF_PER_SECOND
              value: {{ $.Values.simulator.sellOffPerSecond | quote }}
            - name: SELL_OFF_SECONDS
              value: {{ $.Values.simulator.sellOffSeconds | quote }}
            - name: ORDER_TRAFFIC_SEED
              value: {{ $.Values.simulator.trafficSeed | quote }}
            {{- end }}
            {{- if eq .name "order-service" }}
            - name: BUYING_POWER_SERVICE_URL
              value: "http://buying-power-service:8080"
            {{- end }}
            {{- if eq .name "buying-power-service" }}
            - name: SLOW_REFLECTION_DELAY_MS
              value: {{ $.Values.buyingPower.slowReflectionDelayMs | quote }}
            {{- end }}
            {{- if eq .name "trade-report-service" }}
            - name: SETTLEMENT_CYCLE_DAYS
              value: {{ $.Values.tradeReport.settlementCycleDays | quote }}
            {{- if $.Values.tradeReport.holidays }}
            - name: DEMO_MARKET_HOLIDAYS
              value: {{ $.Values.tradeReport.holidays | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .name "notification-service" }}
            - name: PUSH_GATEWAY_URL
              value: "http://push-gateway-simulator:8080"
            {{- end }}
            - name: BROKERAGE_DEMO_OPERATOR_TOKEN_SHA256
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.security.apiSecretName }}
                  key: operator-token-sha256
            {{- if has .name (list "buying-power-service" "order-state-service") }}
            - name: BROKERAGE_DEMO_READ_ONLY_TOKEN_SHA256
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.security.apiSecretName }}
                  key: simulator-token-sha256
            {{- end }}
            {{- $incomingKeys := dict "order-service" "simulator-token" "buying-power-service" "order-token" "exchange-gateway-simulator" "simulator-token" "push-gateway-simulator" "notification-token" }}
            {{- $incoming := get $incomingKeys .name }}
            {{- if $incoming }}
            - name: BROKERAGE_DEMO_ALLOWED_SERVICE_TOKEN_SHA256
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.security.apiSecretName }}
                  key: {{ printf "%s-sha256" $incoming }}
            {{- end }}
            {{- $outgoingKeys := dict "order-flow-simulator" "simulator-token" "order-service" "order-token" "notification-service" "notification-token" }}
            {{- $outgoing := get $outgoingKeys .name }}
            {{- if $outgoing }}
            - name: BROKERAGE_DEMO_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.security.apiSecretName }}
                  key: {{ $outgoing }}
            {{- end }}
            {{- if .database }}
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: DATABASE_URL
              value: "jdbc:postgresql://postgresql:5432/{{ $.Values.postgresql.database }}"
            - name: DATABASE_USERNAME
              value: {{ printf "brokerage_%s" (include "brokerage-demo.databaseSchema" .) | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "brokerage-demo-db-%s" .name }}
                  key: runtime-password
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
{{- if .http }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "brokerage-demo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
{{- end }}
