{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    {{- include "brokerage-demo.labels" . | nindent 4 }}
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
  {{- range $index, $key := keys .Values.storageClass.volumeTags | sortAlpha }}
  tagSpecification_{{ add1 $index }}: {{ printf "%s=%s" $key (get $.Values.storageClass.volumeTags $key) | quote }}
  {{- end }}
{{- end }}
