{{- $topics := list
  "brokerage.orders.accepted.v1"
  "brokerage.executions.v1"
  "brokerage.orders.expired.v1"
  "brokerage.buying-power.updated.v1"
  "brokerage.trade-reports.issued.v1"
  "brokerage.notifications.delivered.v1"
  "brokerage.notifications.retry.5s.v1"
  "brokerage.notifications.retry.30s.v1"
  "brokerage.notifications.dlt.v1" }}
{{- range $topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ . | replace "." "-" }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name }}
spec:
  topicName: {{ . }}
  partitions: {{ $.Values.kafka.partitions }}
  replicas: {{ $.Values.kafka.replicationFactor }}
  config:
    min.insync.replicas: {{ $.Values.kafka.minInSyncReplicas }}
    retention.ms: 604800000
{{- end }}

