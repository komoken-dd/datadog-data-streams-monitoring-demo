environment: demo
version: "0.1.0"

image:
  repositoryPrefix: brokerage-demo
  tag: "0.1.0"
  pullPolicy: IfNotPresent
  # Released deployments provide one immutable GHCR tag+digest reference per
  # service. Local development falls back to repositoryPrefix/name:tag.
  references: {}

simulator:
  baselinePerSecond: 3
  openingRushPerSecond: 25
  openingRushSeconds: 60
  sellOffPerSecond: 25
  sellOffSeconds: 120
  trafficSeed: "424242"

buyingPower:
  # Per-execution processing delay injected by the buying-power-delay scenario.
  slowReflectionDelayMs: 2500

tradeReport:
  # T+N JPX business days. Holidays default to the built-in 2026-2027 calendar.
  settlementCycleDays: 2

storageClass:
  create: false
  name: gp3

applications:
  - name: order-flow-simulator
    http: true
    database: false
    resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 768Mi } }
  - name: order-service
    http: true
    database: false
    resources: { requests: { cpu: 75m, memory: 256Mi }, limits: { memory: 768Mi } }
  - name: buying-power-service
    http: true
    database: true
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
  - name: exchange-gateway-simulator
    http: true
    database: true
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
  - name: holdings-service
    http: false
    database: true
    resources: { requests: { cpu: 75m, memory: 256Mi }, limits: { memory: 768Mi } }
  - name: trade-report-service
    http: false
    database: true
    resources: { requests: { cpu: 75m, memory: 256Mi }, limits: { memory: 768Mi } }
  - name: notification-service
    http: false
    database: false
    resources: { requests: { cpu: 75m, memory: 256Mi }, limits: { memory: 768Mi } }
  - name: push-gateway-simulator
    http: true
    database: false
    resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 768Mi } }
  - name: order-state-service
    http: true
    database: true
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
  - name: exception-management-service
    http: true
    database: true
    resources: { requests: { cpu: 75m, memory: 256Mi }, limits: { memory: 768Mi } }

kafka:
  name: brokerage-kafka
  version: "4.2.1"
  image: quay.io/strimzi/kafka:1.1.0-kafka-4.2.1@sha256:4cdf885bba8b67a637f8565058a8a26ed7115e1c7bdf76d6f32df3cd1aa38503
  entityOperatorImage: quay.io/strimzi/operator:1.1.0@sha256:0b18356206d5b98888bb1bca6acd389bbb302ecdcb5f7ea697ddfefbe1a653e6
  replicas: 1
  partitions: 6
  replicationFactor: 1
  minInSyncReplicas: 1
  storage:
    size: 10Gi
    deleteClaim: true
    class: ""

postgresql:
  image: docker.io/library/postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
  database: brokerage
  username: brokerage
  secretName: brokerage-demo-postgresql
  createSecret: false
  password: ""
  persistence:
    enabled: false
    size: 10Gi
    class: ""

datadog:
  registry: registry.datadoghq.com
  dsm:
    # The state projection consumes every lifecycle topic and can obscure the
    # primary flow. Set true when studying the complete consumer topology.
    orderStateServiceEnabled: false
  namespace: datadog
  clusterName: brokerage-demo-kind
  clusterAgentReplicas: 2
  kubeletTlsVerify: true
  site: datadoghq.com
  # Create this Secret out-of-band when credentials are managed externally.
  secretName: datadog-secret
  agentImageName: agent
  agentImageTag: 7.82.3@sha256:abb3279b6465f8641eff1ee7cc2bea293221accafc8f0a9a256e4e4835dc8e17
  clusterAgentImageName: cluster-agent
  clusterAgentImageTag: 7.82.3@sha256:fb934c106ef1c27c84f46030c292006bfbebfa850c8a58668dc9b0d1215c9838
  javaTracerImage: registry.datadoghq.com/dd-lib-java-init:v1.69.1@sha256:183a30acef6027881a2c7fd4f78f066412d32eecfa7e84f84b9dd5d0bc807341
  apmInjectorImage: registry.datadoghq.com/apm-inject:0.66.0@sha256:4e6ecdc36bbfb13da98de46797b4a192b511b6195f75a762fd6eb90962e45a06
