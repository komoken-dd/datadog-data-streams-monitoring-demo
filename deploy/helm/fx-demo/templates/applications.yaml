{{- range .Values.applications }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "fx-demo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
    tags.datadoghq.com/env: {{ $.Values.environment | quote }}
    tags.datadoghq.com/service: {{ .name | quote }}
    tags.datadoghq.com/version: {{ $.Values.version | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: fx-demo
        tags.datadoghq.com/env: {{ $.Values.environment | quote }}
        tags.datadoghq.com/service: {{ .name | quote }}
        tags.datadoghq.com/version: {{ $.Values.version | quote }}
        admission.datadoghq.com/enabled: "true"
      annotations:
        admission.datadoghq.com/java-lib.custom-image: {{ $.Values.datadog.javaTracerImage | quote }}
        admission.datadoghq.com/apm-inject.custom-image: {{ $.Values.datadog.apmInjectorImage | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .name }}
          {{- $imageReference := get $.Values.image.references .name }}
          {{- if $imageReference }}
          image: {{ $imageReference | quote }}
          {{- else }}
          image: "{{ $.Values.image.repositoryPrefix }}/{{ .name }}:{{ $.Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ $.Values.kafka.name }}-kafka-bootstrap:9092"
            - name: DD_ENV
              value: {{ $.Values.environment | quote }}
            - name: DD_SERVICE
              value: {{ .name | quote }}
            - name: DD_VERSION
              value: {{ $.Values.version | quote }}
            - name: DD_DATA_STREAMS_ENABLED
              {{- if eq .name "order-state-service" }}
              value: {{ $.Values.datadog.dsm.orderStateServiceEnabled | quote }}
              {{- else }}
              value: "true"
              {{- end }}
            - name: DD_TRACE_REMOVE_INTEGRATION_SERVICE_NAMES_ENABLED
              value: "true"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_TRACE_OTEL_ENABLED
              value: "true"
            - name: DD_METRICS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_TAGS_ENV
              value: {{ $.Values.environment | quote }}
            - name: MANAGEMENT_METRICS_TAGS_SERVICE
              value: {{ .name | quote }}
            - name: MANAGEMENT_METRICS_TAGS_VERSION
              value: {{ $.Values.version | quote }}
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- if eq .name "order-generator" }}
            - name: BASELINE_PER_SECOND
              value: {{ $.Values.generator.baselinePerSecond | quote }}
            - name: SURGE_PER_SECOND
              value: {{ $.Values.generator.surgePerSecond | quote }}
            - name: SURGE_DURATION_SECONDS
              value: {{ $.Values.generator.surgeDurationSeconds | quote }}
            - name: ORDER_TRAFFIC_SEED
              value: {{ $.Values.generator.trafficSeed | quote }}
            {{- end }}
            {{- if .database }}
            - name: DATABASE_URL
              value: "jdbc:postgresql://postgresql:5432/{{ $.Values.postgresql.database }}"
            - name: DATABASE_USERNAME
              value: {{ $.Values.postgresql.username | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgresql.secretName }}
                  key: password
            {{- end }}
          {{- if .http }}
          ports:
            - name: http
              containerPort: 8080
          {{- end }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- if .http }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- end }}
{{- if .http }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "fx-demo.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
{{- end }}
