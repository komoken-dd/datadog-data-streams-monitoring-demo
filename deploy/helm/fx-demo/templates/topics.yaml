{{- $topics := list
  "fx.orders.received.v1"
  "fx.orders.approved.v1"
  "fx.orders.rejected.v1"
  "fx.trades.executed.v1"
  "fx.trades.confirmed.v1"
  "fx.settlements.instructed.v1"
  "fx.execution.retry.5s.v1"
  "fx.execution.retry.30s.v1"
  "fx.execution.dlt.v1" }}
{{- range $topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ . | replace "." "-" }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name }}
spec:
  topicName: {{ . }}
  partitions: {{ $.Values.kafka.partitions }}
  replicas: {{ $.Values.kafka.replicationFactor }}
  config:
    min.insync.replicas: {{ $.Values.kafka.minInSyncReplicas }}
    retention.ms: 604800000
{{- end }}

